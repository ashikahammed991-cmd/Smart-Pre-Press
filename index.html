<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Pre-Press</title>
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div class="brand">Smart Pre-Press</div>
        <div class="group">
          <button id="btn-open" title="Open project (Ctrl+O)">Open</button>
          <button id="btn-save" title="Save project (Ctrl+S)">Save</button>
          <button id="btn-export" title="Export SVG (Ctrl+E)">Export SVG</button>
          <button id="btn-pdf" class="primary" title="Export print PDF (Ctrl+P)">Export PDF</button>
        </div>
        <div class="group">
          <button id="btn-undo" title="Undo (Ctrl+Z)">Undo</button>
          <button id="btn-redo" title="Redo (Ctrl+Shift+Z)">Redo</button>
        </div>
        <div class="group">
          <button id="btn-zoom-out" title="Zoom out (Ctrl+-)">-</button>
          <button id="btn-zoom-reset" title="Reset zoom (Ctrl+0)">100%</button>
          <button id="btn-zoom-in" title="Zoom in (Ctrl++)">+</button>
        </div>
        <div class="group props">
          <label>Fill <input type="color" id="fill" value="#4f8cff" /></label>
          <label>Stroke <input type="color" id="stroke" value="#1b2a4a" /></label>
          <label>Width <input type="number" id="stroke-width" value="2" min="0" max="100" step="1" /></label>
        </div>
      </header>

      <aside id="toolbar">
        <button class="tool active" data-tool="select" title="Select (V)">V<span>Select</span></button>
        <button class="tool" data-tool="rect" title="Rectangle (R)">R<span>Rect</span></button>
        <button class="tool" data-tool="ellipse" title="Ellipse (E)">E<span>Ellipse</span></button>
        <button class="tool" data-tool="line" title="Line (L)">L<span>Line</span></button>
        <button class="tool" data-tool="pen" title="Pen (P)">P<span>Pen</span></button>
      </aside>

      <main id="stage-wrap">
        <svg id="stage" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
      </main>

      <aside id="side">
        <section>
          <h3>Document</h3>
          <label class="row">Size
            <select id="preset">
              <option value="210x297">A4</option>
              <option value="148x210">A5</option>
              <option value="297x420">A3</option>
              <option value="215.9x279.4">Letter</option>
              <option value="90x55">Business card</option>
              <option value="custom">Custom</option>
            </select>
          </label>
          <div class="row2">
            <label>W <input type="number" id="doc-w" min="1" step="0.1" /> mm</label>
            <label>H <input type="number" id="doc-h" min="1" step="0.1" /> mm</label>
          </div>
          <div class="row2">
            <label>Bleed <input type="number" id="doc-bleed" min="0" step="0.5" /> mm</label>
          </div>
          <label class="check"><input type="checkbox" id="doc-marks" /> Crop marks in PDF</label>
        </section>

        <section>
          <h3>Colour (CMYK %)</h3>
          <div class="cmyk-row"><span>Fill</span>
            <input type="number" id="fc" min="0" max="100" title="Cyan" /><input type="number" id="fm" min="0" max="100" title="Magenta" /><input type="number" id="fy" min="0" max="100" title="Yellow" /><input type="number" id="fk" min="0" max="100" title="Black" />
          </div>
          <div class="cmyk-row"><span>Stroke</span>
            <input type="number" id="sc" min="0" max="100" title="Cyan" /><input type="number" id="sm" min="0" max="100" title="Magenta" /><input type="number" id="sy" min="0" max="100" title="Yellow" /><input type="number" id="sk" min="0" max="100" title="Black" />
          </div>
          <div class="cmyk-legend"><span>C</span><span>M</span><span>Y</span><span>K</span></div>
        </section>

        <section id="layers">
          <h3>Layers</h3>
          <div class="layer-actions">
            <button id="btn-forward" title="Bring forward">Forward</button>
            <button id="btn-backward" title="Send backward">Backward</button>
            <button id="btn-duplicate" title="Duplicate (Ctrl+D)">Duplicate</button>
            <button id="btn-delete" title="Delete (Del)">Delete</button>
          </div>
          <ul id="layer-list"></ul>
        </section>
      </aside>

      <footer id="statusbar"><span id="status">Ready</span></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
