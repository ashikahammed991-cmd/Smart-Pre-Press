name: Release

# Push a tag like v0.1.0 to build installers for Windows, macOS and Linux
# and attach them to a draft GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The Vector Editor tab is VectorCraft (MIT OR Apache-2.0), built for the browser (WebAssembly) and
  # shipped inside the app. Pinned to VectorCraft v0.21.0; change `ref` to update.
  vectorcraft-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: storytold/vectorcraft
          ref: v0.21.0
          path: vc
      - name: Rebrand the editor as Smart Pre-Press
        run: python3 scripts/rebrand-vectorcraft.py vc

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./vc -> target"
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      - run: trunk build --release
        working-directory: vc/apps/vectorcraft-web
      - uses: actions/upload-artifact@v4
        with:
          name: vectorcraft-web
          path: vc/dist/web
          if-no-files-found: error

  build:
    needs: vectorcraft-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-13
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - uses: actions/download-artifact@v4
        with:
          name: vectorcraft-web
          path: editor-src

      - run: npm install
      - run: npm run tauri icon app-icon.png

      - name: Show the project files (diagnostics)
        shell: bash
        run: |
          pwd
          ls -la
          git ls-files | grep -v "^src-tauri/icons" | head -60
          git log --stat -3 --format="%h %s" | head -40

      - name: Check the Vector Editor files are in the build
        shell: bash
        run: |
          ls -la editor-src | head -20
          npm run build
          ls -la dist/vectorcraft | head -20
          test -f dist/vectorcraft/index.html

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Smart Pre-Press ${{ github.ref_name }}"
          releaseBody: "Download the installer for your operating system below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
